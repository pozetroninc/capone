[metadata]
name = capone
# Version is hardcoded for now, consider using setuptools-scm later
version = 1.0.0
author = Hunter Richards
author_email = opensource@counsyl.com
description = Django app representing a double-entry accounting ledger.
long_description = file: README.rst
long_description_content_type = text/x-rst
url = https://github.com/counsyl/capone
# license = Copyright Counsyl, Inc.  # This is not a standard license identifier
license = MIT # Assuming MIT based on LICENSE file content
project_urls =
    Source = https://github.com/counsyl/capone
    Tracker = https://github.com/counsyl/capone/issues
classifiers =
    Development Status :: 5 - Production/Stable
    Framework :: Django
    Framework :: Django :: 3.2
    Framework :: Django :: 4.0
    Framework :: Django :: 4.1
    Framework :: Django :: 4.2
    Intended Audience :: Developers
    Intended Audience :: Financial and Insurance Industry
    Intended Audience :: Healthcare Industry
    Intended Audience :: Legal Industry
    License :: OSI Approved :: MIT License
    Natural Language :: English
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Topic :: Office/Business :: Financial :: Accounting

[options]
packages = find:
python_requires = >=3.8
# Read dependencies from requirements files. Avoids duplication.
install_requires = file: requirements.txt
include_package_data = True
zip_safe = False # Recommended for Django apps

[options.packages.find]
exclude =
    capone.tests*
    docs*
    examples*
    tools*

[options.extras_require]
# Read development dependencies from requirements-dev.txt
# Assuming 'dev' extra for development dependencies
dev = file: requirements-dev.txt

# Add other extras if needed, e.g., for optional features
# test =
#    pytest>=6.0
#    pytest-django

[options.entry_points]
# Define any console scripts or other entry points if needed
# console_scripts =
#     my-command = capone.cli:main
